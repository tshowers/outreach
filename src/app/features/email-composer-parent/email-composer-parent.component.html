<app-preloader [isLoading]="isLoading"></app-preloader>
<!-- Composer (design 4m): the email on the left, TODD docked on the right. -->
<div class="composer-page todd-page">
  <div class="composer-page__main">
    <app-browse-notice surfaceLabel="the Composer"></app-browse-notice>
    <div class="alert alert-warning alert-dismissible fade show" role="alert" *ngIf="showRegisterEmailWarning">
      <h4 class="alert-heading">Heads up</h4>
      <p>To send email through TODD, you must first register your email address by contacting support. This step helps prevent spam and abuse.</p>
      <p class="mb-0"><a href="mailto:info@taliferro.tech?subject=Email%20Address%20Approval">Request approval</a>.</p>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <app-email-create [tenantId]="tenantId" [nomenclature]="nomenclature" [userId]="userId" [firebaseUser]="firebaseUser" (toChange)="updateTo($event)" (subjectChange)="updateSubject($event)" (psChange)="updatePS($event)" (textChange)="updateText($event)" (loader)="setIsLoading($event)" (senderInformation)="onSenderInfo($event)" (useTemplateChange)="onUseTemplate($event)" (momentumDraftAction)="handleMomentumDraftAction($event)"></app-email-create>
  </div>

  <aside class="todd-panel" aria-label="TODD">
    <header class="todd-panel__head">
      <span class="todd-panel__mark" aria-hidden="true">✦</span>
      <strong>TODD</strong>
      <app-email-sending-status class="todd-panel__status" [userId]="userId" [compact]="true"></app-email-sending-status>
    </header>

    <div class="todd-panel__tip" *ngIf="emailTipText">
      <span>Before you send</span>
      <p>{{ emailTipText }}</p>
    </div>

    <div class="todd-panel__selection" *ngIf="editorSelection">
      <span>Working on your selection</span>
      <p>“{{ editorSelection }}”</p>
    </div>

    <div class="todd-panel__chips">
      <button type="button" *ngFor="let chip of toddChips" (click)="askTodd(chip.prompt)">{{ chip.label }}</button>
    </div>

    <app-assistant-box #todd class="todd-panel__chat" [docked]="true" [isOpen]="true" [userId]="userId" [tenantId]="tenantId" [pageContext]="assistantPageContext" placeholder="Ask TODD to revise…"></app-assistant-box>
  </aside>
</div>
