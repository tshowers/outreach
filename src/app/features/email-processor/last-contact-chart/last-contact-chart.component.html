<section class="up-next" aria-labelledby="up-next-title">
    <header class="up-next__head">
        <span class="eyebrow" id="up-next-title">2 · Up next</span>
        <span class="up-next__count">{{ queueReadyCount }} staged</span>
    </header>
    <p class="up-next__empty" *ngIf="!upNext.length">Nobody's waiting. Catalyst lists contacts with a first name, a company and an email address.</p>
    <div class="up-next__row" *ngFor="let row of upNext">
        <span class="up-next__badge" aria-hidden="true">{{ row.initials }}</span>
        <span class="up-next__who">
            <strong>{{ row.name }}</strong>
            <span>{{ row.company }}</span>
        </span>
        <span class="up-next__days" [class.up-next__days--urgent]="row.days >= 30">{{ row.days }}d</span>
    </div>
    <p class="up-next__more" *ngIf="queueReadyCount > upNext.length">and {{ queueReadyCount - upNext.length }} more</p>
</section>
