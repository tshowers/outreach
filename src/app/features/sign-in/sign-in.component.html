<div class="sign-in-shell">
  <div class="sign-in-card">
    <img class="sign-in-logo" src="assets/todd-icon.png" alt="TODD" />
    <h1 class="mb-1">Sign in</h1>
    <p class="text-muted mb-4">Sign in with your TODD account to continue.</p>
    <button type="button" class="btn btn-dark w-100" [disabled]="isSigningIn" (click)="signIn()">
      {{ isSigningIn ? 'Redirecting...' : 'Sign in with TODD' }}
    </button>
  </div>
</div>
