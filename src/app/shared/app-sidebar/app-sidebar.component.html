<aside class="sidebar" aria-label="Outreach">
  <a class="sidebar__brand" routerLink="/app">
    <img class="brand-mark--light" src="assets/brand/products/svg/light/05-outreach.svg" alt="" width="32" height="32"><img class="brand-mark--dark" src="assets/brand/products/svg/dark/05-outreach.svg" alt="" width="32" height="32">
    <span>16Ahead <span class="brand-product">Outreach</span></span>
  </a>

  <a class="sidebar__new" routerLink="/compose-email" data-cy="sidebar-new-email">
    <span class="sidebar__icon" [innerHTML]="plusIcon"></span>
    New email
  </a>

  <nav class="sidebar__nav">
    <ng-container *ngFor="let group of groups">
      <span *ngIf="group.label" class="sidebar__group">{{ group.label }}</span>
      <a *ngFor="let item of group.items"
         class="sidebar__item"
         [routerLink]="item.link"
         [queryParams]="item.queryParams || null"
         routerLinkActive="is-active"
         [routerLinkActiveOptions]="{ paths: 'subset', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
         [attr.data-tint]="item.tint">
        <span class="sidebar__icon" [innerHTML]="item.icon"></span>
        <span class="sidebar__label">{{ item.label }}</span>
        <span *ngIf="countFor(item) > 0" class="sidebar__badge">{{ countFor(item) }}</span>
      </a>
    </ng-container>
  </nav>

  <div class="sidebar__footer">
    <button type="button" class="sidebar__menu" (click)="openMenu.emit()" data-sound="off">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      Menu
    </button>
  </div>
</aside>
