<aside class="sidebar" aria-label="Outreach">
  <a class="sidebar__brand" routerLink="/app">
    <img src="assets/outreach/logo.png" alt="" width="32" height="32">
    <span>Outreach</span>
  </a>

  <nav class="sidebar__nav">
    <a *ngFor="let item of items"
       class="sidebar__item"
       [routerLink]="item.link"
       [queryParams]="item.queryParams || null"
       routerLinkActive="is-active"
       [routerLinkActiveOptions]="item.exact ? { exact: true } : { paths: 'subset', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
       [attr.data-tint]="item.tint">
      <span class="sidebar__icon" [innerHTML]="item.icon"></span>
      <span class="sidebar__label">{{ item.label }}</span>
      <span *ngIf="countFor(item) > 0" class="sidebar__badge">{{ countFor(item) }}</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <button type="button" class="sidebar__menu" (click)="openMenu.emit()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      Menu
    </button>
  </div>
</aside>
