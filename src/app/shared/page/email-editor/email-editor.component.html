<div class="editor-container" data-demo="email-editor">
  <!-- Find-style toolbar (design 4m): the everyday tools as pills, Template and
       Code on the right, everything else behind More. -->
  <div class="editor-toolbar" data-demo="email-editor-toolbar">
    <div class="editor-toolbar__main">
      <button type="button" class="tool" (click)="format('bold')" title="Bold"><b>B</b></button>
      <button type="button" class="tool" (click)="format('italic')" title="Italic"><i>I</i></button>
      <button type="button" class="tool" (click)="format('underline')" title="Underline"><u>U</u></button>
      <button type="button" class="tool" (click)="formatBlock('h1')" title="Heading 1">H1</button>
      <button type="button" class="tool" (click)="formatBlock('h2')" title="Heading 2">H2</button>
      <button type="button" class="tool" (click)="createList('insertUnorderedList')" title="Bulleted list">•</button>
      <button type="button" class="tool" (click)="createList('insertOrderedList')" title="Numbered list">1.</button>
      <button type="button" class="tool" (click)="createLink()" title="Link">Link</button>
      <label class="tool" for="fileInput" title="Insert image">Image</label>
      <input type="file" id="fileInput" class="d-none" (change)="insertImage($event)" accept="image/*" title="Upload Image">
      <button type="button" class="tool" [class.is-on]="showMoreTools" (click)="showMoreTools = !showMoreTools" [attr.aria-expanded]="showMoreTools" title="More formatting">More ▾</button>
    </div>
    <div class="editor-toolbar__end">
      <select *ngIf="mode === 'email'" [(ngModel)]="selectedTemplate" class="tool tool--select" (change)="onTemplateChange()" title="Template">
        <option value="">Template</option>
        <option value="minimal">Minimal CTA</option>
        <option value="hero">Hero Image</option>
        <option value="textOnly">Text-Only</option>
        <option value="yourSuccess">Your Success</option>
      </select>
      <button type="button" class="tool" [class.is-on]="isCodeView" (click)="toggleView()" title="Switch between the editor and HTML"><ng-container *ngIf="isCodeView">Editor</ng-container><ng-container *ngIf="!isCodeView">&lt;/&gt; Code</ng-container></button>
    </div>
    <div class="editor-toolbar__more" *ngIf="showMoreTools">
      <button type="button" class="tool" (click)="format('strikethrough')" title="Strikethrough"><s>S</s></button>
      <button type="button" class="tool" (click)="alignText('left')" title="Align left">Left</button>
      <button type="button" class="tool" (click)="alignText('center')" title="Align center">Center</button>
      <button type="button" class="tool" (click)="alignText('right')" title="Align right">Right</button>
      <label class="tool tool--color" title="Text color">A <input type="color" (input)="changeFontColor($event)"></label>
      <label class="tool tool--color" title="Highlight color">Fill <input type="color" (input)="changeBackgroundColor($event)"></label>
      <button type="button" class="tool" (click)="insertTwoColumnLayout()" title="Insert 2-column layout">2 columns</button>
      <button type="button" class="tool" data-demo="email-editor-spell-check" (click)="onCheckGrammar()" title="Check grammar">{{ isChecking ? 'Checking…' : 'Grammar' }}</button>
      <button type="button" class="tool maya-avatar-button" data-demo="email-editor-maya-rewrite" (click)="generateMayaEmailContent()" [disabled]="isMayaDrafting" title="Ask Maya to rewrite this draft or create one in her style" aria-label="Ask Maya to rewrite this draft or create one in her style">
        <img *ngIf="!isMayaDrafting" [src]="mayaAvatarSrc" alt="" class="maya-avatar-button__image">
        {{ isMayaDrafting ? 'Maya is writing…' : 'Maya' }}
      </button>
      <button type="button" class="tool" (click)="format('removeFormat')" title="Clear formatting">Clear</button>
      <select class="tool tool--select" [(ngModel)]="selectedFont" (change)="changeFont($event)" title="Font">
        <option value="" disabled selected>Font</option>
        <option *ngFor="let font of fonts" [value]="font">{{ font }}</option>
      </select>
      <select class="tool tool--select" (change)="changeFontSize($event)" title="Size">
        <option value="" disabled selected>Size</option>
        <option value="1">Small</option>
        <option value="3">Normal</option>
        <option value="5">Large</option>
        <option value="7">Extra Large</option>
      </select>
      <label class="tool" *ngIf="mode === 'email'"><input type="checkbox" [(ngModel)]="isUsingTemplate" (click)="onUseTemplate()"> Custom template</label>
    </div>
    <div class="editor-toolbar__drafts" *ngIf="campaignDrafts">
      <label class="form-label">Select draft</label>
      <select class="tool tool--select" [ngModel]="selectedDraftKey" (ngModelChange)="selectDraft($event)">
        <option *ngFor="let key of draftKeys()" [value]="key">{{ key | capitalizeFirst}}</option>
      </select>
    </div>
  </div>
  <!-- <div *ngIf="showTones" class="tone-dropdown-container mt-2">
    <label for="toneSelect">Select Tone: </label>
    <select id="toneSelect" class="ios-select fpl-2 mb-2" (change)="onToneChange($event)">
      <option value="" disabled selected>Choose a tone</option>
      <option *ngFor="let tone of emailTones" [value]="tone.tone" [title]="tone.emotionalFrame || tone.persona">
        {{ tone.name }}
      </option>
    </select>
  </div> -->
  <div class="progress" *ngIf="uploadProgress > 0 && uploadProgress < 100" class="progress">
    <div class="progress-bar" role="progressbar" [style.width.%]="uploadProgress" [attr.aria-valuenow]="uploadProgress" aria-valuemin="0" aria-valuemax="100">{{uploadProgress}}%</div>
  </div>
  <div *ngIf="!isCodeView" contenteditable="true" class="editor border p-2" data-demo="email-editor-canvas" (input)="onInput()" #editorRef (paste)="onPaste($event)"></div>
  <div *ngIf="isCodeView">
    <!-- Code View (textarea) -->
    <textarea [(ngModel)]="htmlContent" (ngModelChange)="onInput()" class="code-editor border p-2" rows="12 " cols="100"></textarea>
  </div>
</div>
