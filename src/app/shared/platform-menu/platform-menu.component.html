<button
  type="button"
  class="platform-menu-trigger"
  (click)="toggle()"
  [attr.aria-expanded]="isOpen"
  aria-controls="platform-menu-panel"
  [attr.aria-label]="isOpen ? 'Close menu' : 'Open menu'"
>
  <span class="platform-menu-trigger__bars" aria-hidden="true"><i></i><i></i><i></i></span>
  <span class="platform-menu-trigger__label">{{ isOpen ? 'Close' : 'Menu' }}</span>
</button>

<div class="platform-menu-overlay" *ngIf="isOpen" (click)="close()"></div>

<div
  id="platform-menu-panel"
  class="platform-menu-panel"
  [class.platform-menu-panel--open]="isOpen"
  role="dialog"
  aria-label="Apps and account"
>
  <div class="platform-menu-panel__inner">
    <div class="platform-menu-panel__columns">
      <div class="platform-menu-col">
        <span class="platform-menu-eyebrow">Outreach</span>
        <nav class="platform-menu-route-list" aria-label="Outreach routes">
          <a
            *ngFor="let link of outreachLinks"
            class="platform-menu-route"
            [routerLink]="link.route"
            (click)="close()"
          >
            <span>{{ link.label }}</span><b>&#8599;</b>
          </a>
        </nav>

        <span class="platform-menu-eyebrow">Products</span>
        <div class="platform-menu-launcher">
          <a
            *ngFor="let link of productLinks"
            class="platform-menu-app"
            [href]="link.url"
            target="_blank"
            rel="noopener noreferrer"
            (click)="close()"
          >
            <span class="platform-menu-app__icon"><img [src]="link.icon" alt="" aria-hidden="true" /></span>
            <span class="platform-menu-app__label">{{ link.label }}</span>
          </a>
        </div>
      </div>

      <div class="platform-menu-col">
        <span class="platform-menu-eyebrow">Account</span>
        <nav class="platform-menu-editorial">
          <a
            *ngFor="let item of accountItems"
            class="platform-menu-editorial__link"
            [href]="item.url"
            target="_blank"
            rel="noopener noreferrer"
            (click)="close()"
          >
            <span>{{ item.label }}</span><b>&#8599;</b>
          </a>
        </nav>
      </div>
    </div>

    <footer class="platform-menu-contact">
      <span class="platform-menu-eyebrow">Taliferro Tech, LLC</span>
      <div class="platform-menu-contact__details">
        <span><b>Email:</b> support&#64;taliferro.tech</span>
        <span><b>Phone:</b> 401.646.2662</span>
        <span><b>Office:</b> 1424 11th Ave STE 400, Seattle, WA 98122</span>
      </div>
    </footer>
  </div>
</div>
